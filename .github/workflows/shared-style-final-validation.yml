name: Shared Style Final Validation

on:
  push:
    branches:
      - refactor/shared-style-system

permissions:
  contents: write

jobs:
  cleanup-validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout shared style branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply final shared style cleanup
        run: python tools/shared-style-final-cleanup.py

      - name: Build shared UI
        run: dotnet build Noctra.UI/Noctra.UI.csproj -c Debug

      - name: Build mobile UI
        run: dotnet build Noctra.Mobile/Noctra.Mobile.csproj -c Debug

      - name: Build desktop UI
        run: dotnet build Noctra.Avalonia/Noctra.Avalonia.csproj -c Debug

      - name: Run style regression contracts
        shell: pwsh
        run: |
          dotnet test Noctra.Tests/Noctra.Tests.csproj -c Debug --filter "FullyQualifiedName~SharedThemeCanonicalizationTests|FullyQualifiedName~SharedUiArchitectureContractTests|FullyQualifiedName~SharedMobileSearchInputContractTests|FullyQualifiedName~DesktopMobileFirstShellTests|FullyQualifiedName~MobileReleaseGuardTests.MobileTextBoxes|FullyQualifiedName~DesktopSettingsSelectionSheetTests|FullyQualifiedName~MobileRecentRegressionTests"

      - name: Commit validated cleanup
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/shared-style-final-validation.yml'
          Remove-Item 'tools/shared-style-final-cleanup.py'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Final style cleanup produced no changes.' }
          git commit -m 'refactor(ui): finish shared style consolidation [style-bot]'
          git push origin HEAD:refactor/shared-style-system
