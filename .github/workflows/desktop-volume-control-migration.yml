name: Desktop Pointer Volume Migration

on:
  push:
    branches:
      - refactor/desktop-volume-control

permissions:
  contents: write

jobs:
  migrate-validate-and-commit:
    runs-on: windows-latest
    steps:
      - name: Checkout volume branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply desktop volume migration
        shell: pwsh
        run: |
          $script = Get-Content tools/apply-desktop-volume-control.py -Raw
          $script = $script.Replace('GotFocusEventArgs e', 'RoutedEventArgs e')
          Set-Content tools/apply-desktop-volume-control.py -Value $script -NoNewline
          python tools/apply-desktop-volume-control.py

          $testPath = 'Noctra.Tests/DesktopVolumeControlTests.cs'
          $test = Get-Content $testPath -Raw
          $old = @'
              private static string Read(params string[] parts)
                  => File.ReadAllText(Path.Combine(parts));
          '@
          $new = @'
              private static string Read(params string[] parts)
              {
                  var root = FindRepositoryRoot();
                  return File.ReadAllText(Path.Combine(new[] { root }.Concat(parts).ToArray()));
              }

              private static string FindRepositoryRoot()
              {
                  var directory = new DirectoryInfo(AppContext.BaseDirectory);
                  while (directory is not null && !File.Exists(Path.Combine(directory.FullName, "NoctraPlayer.sln")))
                      directory = directory.Parent;

                  return directory?.FullName
                      ?? throw new DirectoryNotFoundException("Could not locate the repository root.");
              }
          '@
          if (-not $test.Contains($old.Trim())) { throw 'Desktop volume test helper was not found.' }
          $test = $test.Replace($old.Trim(), $new.Trim())
          Set-Content $testPath -Value $test -NoNewline

      - name: Build shared UI
        shell: pwsh
        run: dotnet build Noctra.UI/Noctra.UI.csproj -c Debug

      - name: Build mobile UI
        shell: pwsh
        run: dotnet build Noctra.Mobile/Noctra.Mobile.csproj -c Debug

      - name: Build desktop UI
        shell: pwsh
        run: dotnet build Noctra.Avalonia/Noctra.Avalonia.csproj -c Debug

      - name: Run focused player regressions
        shell: pwsh
        run: dotnet test Noctra.Tests/Noctra.Tests.csproj -c Debug --filter "FullyQualifiedName~DesktopVolumeControlTests|FullyQualifiedName~SharedUiArchitectureTests|FullyQualifiedName~PlayerViewModelControlsTests|FullyQualifiedName~MobileRecentRegressionTests"

      - name: Commit validated volume controls
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Noctra.UI/Views/Player/PlayerTransportBar.axaml
          git add Noctra.UI/Views/Player/PlayerTransportBar.axaml.cs
          git add Noctra.UI/Views/Player/PlayerChromeView.axaml
          git add Noctra.UI/Views/Player/PlayerChromeView.axaml.cs
          git add Noctra.Avalonia/Views/VideoOverlayView.SharedPresentation.cs
          git add Noctra.Avalonia/Views/VideoOverlayView.axaml.cs
          git add Noctra.Tests/DesktopVolumeControlTests.cs
          git rm tools/apply-desktop-volume-control.py
          git rm .github/workflows/desktop-volume-control-migration.yml
          git commit -m "feat(player): add desktop pointer volume controls"
          git push origin HEAD:refactor/desktop-volume-control
