name: Shared UI Theme Cleanup

on:
  push:
    branches:
      - refactor/shared-ui-theme-cleanup

permissions:
  contents: write

jobs:
  patch-validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest

    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply final source patches
        shell: pwsh
        run: |
          $mainWindowPath = 'Noctra.Avalonia/MainWindow.axaml'
          $mainWindow = [IO.File]::ReadAllText($mainWindowPath)
          $oldRadius = '<Setter Property="CornerRadius" Value="81" />'
          $newRadius = '<Setter Property="CornerRadius" Value="{DynamicResource RadiusPill}" />'
          if (-not $mainWindow.Contains($oldRadius)) { throw 'ResumePrimaryButton magic radius was not found.' }
          $mainWindow = $mainWindow.Replace($oldRadius, $newRadius)
          [IO.File]::WriteAllText($mainWindowPath, $mainWindow)

          $releaseGuardPath = 'Noctra.Tests/MobileReleaseGuardTests.cs'
          $releaseGuard = [IO.File]::ReadAllText($releaseGuardPath)
          $oldDark = 'ReadProjectFile("Noctra.Mobile", "Resources", "Themes", "DarkTheme.axaml")'
          $oldLight = 'ReadProjectFile("Noctra.Mobile", "Resources", "Themes", "LightTheme.axaml")'
          $newDark = 'ReadProjectFile("Noctra.UI", "Resources", "Themes", "DarkTheme.axaml")'
          $newLight = 'ReadProjectFile("Noctra.UI", "Resources", "Themes", "LightTheme.axaml")'
          if (-not $releaseGuard.Contains($oldDark) -or -not $releaseGuard.Contains($oldLight)) {
            throw 'Legacy MobileReleaseGuard theme paths were not found.'
          }
          $releaseGuard = $releaseGuard.Replace($oldDark, $newDark).Replace($oldLight, $newLight)
          [IO.File]::WriteAllText($releaseGuardPath, $releaseGuard)

          Remove-Item 'Noctra.Mobile/Resources/Themes/DarkTheme.axaml'
          Remove-Item 'Noctra.Mobile/Resources/Themes/LightTheme.axaml'

      - name: Build shared UI
        run: dotnet build Noctra.UI/Noctra.UI.csproj -c Debug

      - name: Build mobile UI
        run: dotnet build Noctra.Mobile/Noctra.Mobile.csproj -c Debug

      - name: Build desktop UI
        run: dotnet build Noctra.Avalonia/Noctra.Avalonia.csproj -c Debug

      - name: Run focused shared UI tests
        shell: pwsh
        run: |
          dotnet test Noctra.Tests/Noctra.Tests.csproj -c Debug --filter "FullyQualifiedName~SharedThemeCanonicalizationTests|FullyQualifiedName~SharedUiArchitectureContractTests|FullyQualifiedName~SharedMobileSearchInputContractTests|FullyQualifiedName~DesktopMobileFirstShellTests|FullyQualifiedName~SharedUiHardeningTests|FullyQualifiedName~MobileTextBoxes_UseAccessibleTouchTargetsAndNoctraSelectionColors"

      - name: Commit validated cleanup
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/shared-ui-theme-cleanup.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'Cleanup produced no changes to commit.' }
          git commit -m 'fix(ui): finalize shared theme cleanup [cleanup-bot]'
          git push origin HEAD:refactor/shared-ui-theme-cleanup
